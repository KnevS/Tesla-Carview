name: Deploy

on:
  # Triggers only after CI has successfully built and pushed the images.
  # This guarantees the GHCR images exist before we pull them on the server.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Nachholtermin: Ein Deploy, der tagsüber am Wartungsfenster scheitert,
  # wird nachts nachgeholt. Stündlich (Minute 17, abseits der vollen Stunde),
  # weil GitHub geplante Läufe stark verspätet startet: die früheren festen
  # Termine 00:40/01:40 UTC liefen 10–11/2026 erst 05:30–09:00 UTC an und
  # verfehlten das Fenster jede Nacht. Läufe ohne Arbeit enden nach Sekunden.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Secrets (in GitHub Repository Settings → Secrets):
#   DEPLOY_HOST        – IP oder Hostname des Zielservers
#   DEPLOY_USER        – SSH-Benutzer
#   DEPLOY_SSH_KEY     – privater SSH-Key (ed25519); auf dem Server per Pförtner auf „deploy <commit>“ beschränkt
#   DEPLOY_KNOWN_HOSTS – Host-Schlüssel des Servers (festgenagelt)
# Die eigentliche Deploy-Logik liegt root-eigen auf dem Server: deploy/server/tesla-carview-deploy.

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-secrets:
    name: Secrets vorhanden?
    runs-on: ubuntu-latest
    # For workflow_run: only deploy when CI succeeded. For manual dispatch: always.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: write   # Nachholtermin stößt fehlende CI-Läufe auf main an
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0

      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Europe/Berlin date +%H)
          # Nachholtermin: nur wenn main weiter ist als der zuletzt ausgerollte
          # Stand (Tag deployed-prod) und CI für diesen Commit grün war.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            done_sha=$(git rev-parse -q --verify 'refs/tags/deployed-prod^{commit}' || true)
            if [ "$done_sha" = "$GITHUB_SHA" ]; then
              echo "::notice::Produktion ist auf ${GITHUB_SHA:0:7} - nichts nachzuholen."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Alarm statt stillem Stau: hängt Produktion seit über 3 Tagen
            # hinter main, schlägt der Lauf einmal täglich (12 Uhr Berlin) fehl.
            if [ -n "$done_sha" ]; then
              first=$(git log --reverse --format=%ct "$done_sha..$GITHUB_SHA" | head -1)
            else
              first=$(git log -1 --format=%ct "$GITHUB_SHA")
            fi
            age_h=$(( ( $(date +%s) - ${first:-$(date +%s)} ) / 3600 ))
            if [ "$age_h" -ge 72 ] && [ "$h" = 12 ]; then
              echo "::error::Produktion hängt seit ${age_h} h hinter main (${done_sha:-kein Tag deployed-prod} → ${GITHUB_SHA}). Deploy prüfen."
              exit 1
            fi
            # Merges mit GITHUB_TOKEN (Dependabot-Automerge, Bots) lösen auf
            # main keine CI aus (GitHub-Rekursionsschutz). Ohne CI-Lauf würde
            # der Nachholtermin den Stand nie ausrollen – CI dann anstoßen,
            # der nächste Termin im Fenster rollt aus.
            ci=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -c "$GITHUB_SHA" --json status,conclusion -q '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$ci" in
              "completed success") ;;
              "")
                gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref main
                echo "::notice::Kein CI-Lauf für ${GITHUB_SHA:0:7} - CI angestoßen, Ausrollen beim nächsten Termin."
                echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*)
                echo "::notice::CI für ${GITHUB_SHA:0:7} nicht grün (${ci#completed }) - kein Nachholen."
                echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *)
                echo "::notice::CI für ${GITHUB_SHA:0:7} läuft noch - Ausrollen beim nächsten Termin."
                echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          fi
          # Automatische Deploys starten Container neu und laufen deshalb nur
          # im Wartungsfenster 02:00–05:00 Europe/Berlin; manuell immer.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && { [ "$h" -lt 2 ] || [ "$h" -ge 5 ]; }; then
            echo "::notice::Berlin $h Uhr, außerhalb des Wartungsfensters - wird nachts nachgeholt."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy via SSH
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_ACTOR: ${{ github.actor }}
      # Notausgang: Repository-Variable ALLOW_STALE_CHECKOUT=true laesst den
      # Deploy trotz nicht-synchronem Checkout durchlaufen (dann nur Warnung
      # statt Abbruch). Gedacht fuer Incidents, in denen ein Container-Update
      # dringender ist als ein sauberer Arbeitsbaum. Setzbar unter
      # Settings → Secrets and variables → Actions → Variables, ohne Code-Aenderung.
      ALLOW_STALE_CHECKOUT: ${{ vars.ALLOW_STALE_CHECKOUT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # merge-base beim Markieren des Stands

      - name: Deploy via SSH (Pförtner erlaubt nur „deploy <commit>“)
        id: ssh
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Der Server-Schlüssel ist festgenagelt (DEPLOY_KNOWN_HOSTS) – kein Vertrauen beim ersten Kontakt.
          # Das Deploy-Skript liegt root-eigen auf dem Server (deploy/server/tesla-carview-deploy);
          # per SSH geht nur der Commit, der GHCR-Zugang über die Standardeingabe.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          git fetch -q origin main
          SHA=$(git rev-parse origin/main)
          ARG=""; [ "$ALLOW_STALE_CHECKOUT" = "true" ] && ARG=" --allow-stale"
          set -o pipefail
          printf '%s\n%s\n' "$GHCR_ACTOR" "$GHCR_TOKEN" \
            | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
                  -o ConnectTimeout=30 -o ServerAliveInterval=30 "$USER_@$HOST" "deploy ${SHA}${ARG}" \
            | tee deploy-output.txt
          DEPLOYED=$(sed -n 's/^DEPLOYED_SHA=\([0-9a-f]\{40\}\)$/\1/p' deploy-output.txt | tail -1)
          echo "deployed_sha=$DEPLOYED" >> "$GITHUB_OUTPUT"

      - name: Ausgerollten Stand markieren
        env:
          SHA: ${{ steps.ssh.outputs.deployed_sha }}
        run: |
          [ -n "$SHA" ] || { echo "::warning::Server meldete keinen Commit - Tag bleibt."; exit 0; }
          git fetch -q origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA liegt nicht auf main"; exit 1; }
          git tag -f deployed-prod "$SHA"
          git push -f origin refs/tags/deployed-prod
